name: Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths:
      - "lib/**"
      - ".github/workflows/benchmark.yml"
  pull_request:
    branches:
      - "master"
    paths:
      - "lib/**"
      - ".github/workflows/benchmark.yml"

jobs:
  benchmark:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: ["20", "22", "24"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --silent
      - name: Running benchmark
        run: node test/benchmark.js --benchmark

  profiling:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: ["20", "22", "24"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --silent
      - name: Running profiling
        run: node test/benchmark.js --profiling

      - name: mv flamegraph
        run: |
          mkdir -p ./flamegraph/
          mv ./.tmp-hexo-theme-unit-test/0x/ ./flamegraph/${{ matrix.node-version }}/

      - uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: flamegraph-node${{ matrix.node-version }}
          path: ./flamegraph/

  profiling-preview:
    needs: profiling
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-slim
    environment:
      name: 'profiling-preview'
      url: ${{ env.url }}
      deployment: false
    permissions:
      contents: read
    env:
      url: https://${{ github.sha }}-hexo.surge.sh/
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "flamegraph-*"
          path: ./flamegraph/
          merge-multiple: true

      - name: Publish flamegraph to ${{ env.url }}
        uses: dswistowski/surge-sh-action@v1
        with:
          domain: ${{ env.url }}
          project: ./flamegraph/
          login: ${{ secrets.SURGE_LOGIN }}
          token: ${{ secrets.SURGE_TOKEN }}

      - name: Print full URLs
        run: |
          {
            echo "## Flamegraph"
            echo ""
            for node_version in 20 22 24; do
              echo "${{ env.url }}${node_version}/flamegraph.html"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
